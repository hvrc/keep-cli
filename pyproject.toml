[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keep-cli"
version = "0.1.0"
description = "A command line for Google Keep: read, write, import and export notes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gkeepapi>=0.17.1",
    "gpsoauth>=2.0.0",
]

[project.optional-dependencies]
keyring = ["keyring>=24.0.0"]

[project.scripts]
keep = "keepcli.cli:main"

[tool.setuptools]
packages = ["keepcli"]
